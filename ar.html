<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-Training · Expectations — Kodland Tutor Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">
<style>:root,:root[data-theme="dark"]{--pink:#0E9AA7;--pink-d:#0B7A85;--coral:#0E9AA7;--coral-d:#0B7A85}:root:not([data-theme="dark"]){--pink-l:#DDF1F3}</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <nav class="nav">
    <a class="logo" href="#" onclick="goHome();return false;">
      <span class="logo-mark">kodland</span>
      <span class="logo-div"></span>
      <span class="logo-sub" data-i18n="logoSub"></span>
    </a>
    <div class="nav-r">
      <button class="tbtn" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>
  <div class="hero">
    <div class="hero-inner">
      <div class="eyebrow" data-i18n="heroEyebrow"></div>
      <h1 data-i18n-html="heroTitle"></h1>
      <p data-i18n="heroIntro"></p>
      <div class="hero-art" id="heroArt"></div>
      <div class="hero-cards">
        <div class="hcard"><span class="hc-ic">🧑‍💻</span><div data-i18n-html="heroCard1"></div></div>
        <div class="hcard"><span class="hc-ic">🧪</span><div data-i18n-html="heroCard2"></div></div>
      </div>
      <p class="hero-work" data-i18n="heroWork" style="font-size:14.5px;font-weight:700"></p>
      <button class="start-btn" onclick="goDashboard()" data-i18n="startBtn"></button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="screen-path" class="screen">
  <nav class="nav">
    <a class="logo" href="#" onclick="goHome();return false;">
      <span class="logo-mark">kodland</span>
      <span class="logo-div"></span>
      <span class="logo-sub" data-i18n="logoSub"></span>
    </a>
    <div class="nav-r">
      <span id="ntag" style="font-size:13px;color:var(--text-muted);font-weight:700;display:none"></span>
      <button class="tbtn" onclick="devUnlockAll()" data-i18n-title="devTitle" title="">🔓</button>
      <button class="tbtn" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>
  <div class="msec">
    <div class="slbl" data-i18n="pathLabel"></div>
    <div class="pbar"><b id="pbCount">0/6</b><div class="ptrack"><i id="pbFill"></i></div><span data-i18n="pbLabel"></span></div>
    <div class="grid" id="mgrid"></div>
  </div>
</div>

<!-- CONTENT -->
<div id="screen-content" class="screen">
  <nav class="nav">
    <a class="logo" href="#" onclick="goHome();return false;">
      <span class="logo-mark">kodland</span>
      <span class="logo-div"></span>
      <span class="logo-sub" data-i18n="logoSub"></span>
    </a>
    <div class="nav-r">
      <button class="tbtn" onclick="goDashboard()" data-i18n-title="backToPath" title="">🏠</button>
      <button class="tbtn" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>
  <div class="cbody" id="contentBody"></div>
</div>

<!-- RESULTS -->
<div id="screen-results" class="screen">
  <nav class="nav">
    <a class="logo" href="#" onclick="goHome();return false;">
      <span class="logo-mark">kodland</span><span class="logo-div"></span><span class="logo-sub" data-i18n="logoSub"></span>
    </a>
    <div class="nav-r"><button class="tbtn" onclick="toggleTheme()">🌓</button></div>
  </nav>
  <div class="rbody" id="resultsBody"></div>
</div>


<canvas id="confetti"></canvas>

<script>window.PROG_KEY_OVERRIDE='kl-mt-course_expectations-progress'; window.HERO_ART={ill:'report',orbs:['🎯','📚','💬','🛟']};</script>
<script src="assets/content-ar.js"></script>
<script src="assets/engine.js"></script>
</body>
</html>
